[tool.black]
line-length = 88
target-version = ["py310"]
extend-exclude = '''
(
  ^data/
  | ^trained_models/
  | __pycache__
)
'''

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
  "data",
  "trained_models",
  "__pycache__",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["klasktron", "my_isaaclab_tasks"]
